<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <defs>
    <linearGradient id="dome" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#57e389"/>
      <stop offset="1" stop-color="#26a269"/>
    </linearGradient>
    <linearGradient id="wall" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#deddda"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f9f06b"/>
      <stop offset="1" stop-color="#e5a50a"/>
    </linearGradient>
    <linearGradient id="door" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3d3846"/>
      <stop offset="1" stop-color="#241f31"/>
    </linearGradient>
  </defs>

  <!-- ground shadow -->
  <ellipse cx="64" cy="119" rx="50" ry="4.5" fill="#000000" opacity="0.18"/>

  <!-- minarets -->
  <rect x="12" y="46" width="16" height="70" rx="3" fill="url(#wall)"/>
  <path d="M12 46 h16 l-8 -16 z" fill="url(#dome)"/>
  <rect x="10" y="44" width="20" height="5" rx="2.5" fill="#26a269"/>
  <rect x="17" y="60" width="6" height="12" rx="3" fill="#26a269" opacity="0.55"/>

  <rect x="100" y="46" width="16" height="70" rx="3" fill="url(#wall)"/>
  <path d="M100 46 h16 l-8 -16 z" fill="url(#dome)"/>
  <rect x="98" y="44" width="20" height="5" rx="2.5" fill="#26a269"/>
  <rect x="105" y="60" width="6" height="12" rx="3" fill="#26a269" opacity="0.55"/>

  <!-- hall -->
  <rect x="26" y="72" width="76" height="44" rx="4" fill="url(#wall)"/>
  <path d="M26 110 h76 v2 a4 4 0 0 1 -4 4 h-68 a4 4 0 0 1 -4 -4 z" fill="#c0bfbc"/>

  <!-- windows and the door -->
  <path d="M34 102 v-8 a5 5 0 0 1 10 0 v8 z" fill="#26a269" opacity="0.7"/>
  <path d="M84 102 v-8 a5 5 0 0 1 10 0 v8 z" fill="#26a269" opacity="0.7"/>
  <path d="M50 116 v-22 a14 14 0 0 1 28 0 v22 z" fill="url(#door)"/>
  <path d="M55 116 v-20 a9 9 0 0 1 18 0 v20 z" fill="#1c71d8" opacity="0.35"/>

  <!-- drum and dome -->
  <rect x="30" y="66" width="68" height="9" rx="2" fill="#26a269"/>
  <path d="M28 68 a36 36 0 0 1 72 0 z" fill="url(#dome)"/>
  <path d="M40 58 a28 28 0 0 1 20 -22" fill="none" stroke="#ffffff" stroke-opacity="0.4" stroke-width="4" stroke-linecap="round"/>

  <!-- finial -->
  <rect x="62.5" y="20" width="3" height="14" rx="1.5" fill="url(#gold)"/>
  <path d="M64 5 a8.5 8.5 0 1 0 8 11.2 a6.8 6.8 0 0 1 -8 -11.2 z" fill="url(#gold)"/>
</svg>
